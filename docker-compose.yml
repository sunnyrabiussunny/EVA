version: "3.9"

services:
  backend:
    build: ./backend
    container_name: eva-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      # Persistent data — survives container restarts and rebuilds
      - eva_data:/app/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:latest}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: eva-frontend
    restart: unless-stopped
    ports:
      - "9999:9999"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  # Named volume — knowledge files, SQLite DB, everything persists here
  eva_data:
    name: eva_persistent_data

networks:
  default:
    name: eva-network
